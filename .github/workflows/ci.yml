name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      # Sisa temuan berasal dari rantai dev-only prisma → @prisma/config →
      # deepmerge-ts yang butuh Prisma 6→7. Jadikan blocking setelah upgrade itu.
      - name: Audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-placeholder-secret-minimal-32-karakter-panjang' }}
